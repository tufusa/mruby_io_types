on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:

name: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
      - name: Release Gem
      # uses: rubygems/release-gem@v1
        run: echo 'Release!'
